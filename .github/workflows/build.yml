name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee -a build-log.txt

      - name: Debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee -a build-log.txt

      - name: Publish the debug-latest pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk bigly-debug.apk
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest bigly-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Debug build (latest)" \
            --notes "Debug APK built automatically from commit $GITHUB_SHA. For testing only."

      - name: Lint
        run: |
          set -o pipefail
          ./gradlew --no-daemon lintDebug 2>&1 | tee -a build-log.txt

      # Turn compiler errors and failing tests into annotations, visible on the run page.
      - name: Report failures
        if: failure()
        run: |
          {
            grep -E '^e: |^w: .*error' build-log.txt || true
            grep -A12 'What went wrong' build-log.txt || true
            grep -B2 -A6 -E 'FAILED$' build-log.txt | grep -vE '^> Task' || true
          } | head -80 > failures.txt
          # One annotation holds everything (annotations are capped at 10 per step).
          echo "::error title=Build failure::$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' failures.txt)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bigly-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
