name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Publish the debug-latest pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk bigly-debug.apk
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest bigly-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Debug build (latest)" \
            --notes "Debug APK built automatically from commit $GITHUB_SHA. For testing only."

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bigly-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
