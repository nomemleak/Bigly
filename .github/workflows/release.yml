name: Release

# Push a tag such as v1.2.0 to publish a signed APK on the GitHub Releases page
# (used by the "GitHub" and "Obtainium" install links of the README).
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore the release key
        env:
          KEYSTORE_BASE64: ${{ secrets.BIGLY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BIGLY_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error title=Missing signing secrets::Add BIGLY_KEYSTORE_BASE64 and BIGLY_KEYSTORE_PASSWORD in Settings > Secrets and variables > Actions, then run this workflow again."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: Test and build the signed APK
        env:
          BIGLY_KEYSTORE_FILE: ${{ runner.temp }}/release.p12
          BIGLY_KEYSTORE_PASSWORD: ${{ secrets.BIGLY_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk "bigly-$VERSION.apk"
          {
            echo "### English"
            cat "fastlane/metadata/android/en-US/changelogs/$CODE.txt"
            echo
            echo "### Français"
            cat "fastlane/metadata/android/fr-FR/changelogs/$CODE.txt"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" "bigly-$VERSION.apk" \
            --title "Bigly $VERSION" \
            --notes-file notes.md \
            --verify-tag

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.p12"
